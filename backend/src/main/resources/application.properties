spring.application.name=backend

# Database / Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cortexa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}

# JWT Security Settings
jwt.secret=${JWT_SECRET:5QeW6rTy9UiOpAsDfGhJkLzXcVbNm123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ}
jwt.expiration=${JWT_EXPIRATION:3600000}